name: Fork platform build

on:
  # Build every feature branch in the fork. The upstream main-build workflow
  # already covers main with its full release matrix.
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: fork-platform-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-13
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      asset-prefix: handy-fork
      upload-artifacts: true
      sign-binaries: false
    secrets: inherit
